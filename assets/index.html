<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- viewport-fit=cover: layar berponi/bernotch membuat env(safe-area-inset-*) bernilai nyata,
       dan itu dipakai padding .app-shell, FAB, serta toast supaya tidak ada kontrol yang
       tertutup sudut membulat layar. -->
  <meta name="theme-color" content="#100e08" />
  <meta name="color-scheme" content="dark light" />
  <title>Gutok Drive | Cloud storage</title>
  <!-- Mode gelap/terang diterapkan SEBELUM CSS dimuat. Tanpa skrip kecil ini, pengguna mode terang
       melihat kedipan gelap di setiap muat halaman. Nilainya sama dengan kunci di js/tema.js;
       localStorage bisa melempar (mode privat/kebijakan), jadi kegagalannya ditelan diam-diam. -->
  <script>
    try {
      var p = localStorage.getItem('gutok-tema');
      var t = p === 'terang' || p === 'gelap' ? p
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'terang' : 'gelap');
      document.documentElement.dataset.tema = t;
      document.documentElement.style.colorScheme = t;
    } catch (e) { document.documentElement.dataset.tema = 'gelap'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/views.css" />
</head>
<body>
  <!-- Seluruh UI dibangun oleh app.js ke dalam #app; #toast untuk notifikasi singkat. -->
  <div id="app"></div>
  <div id="toast" class="toast" popover="manual" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
